name: Import Codex Wake and build first phone APK
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: codex-phone-test
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Import verified native screen changes
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 2e31652be39b1751a6a75eac3027716b7d5286b1
          python3 - <<'PY'
          import base64, gzip, json, pathlib, subprocess
          data = json.loads(gzip.decompress(base64.b64decode('')))
          patch = pathlib.Path('/tmp/codex-native.patch')
          patch.write_text(data['patch'], encoding='utf-8')
          subprocess.run(['git', 'apply', '--index', str(patch)], check=True)
          for path in data['deleted']:
              assert path.startswith('app/src/') and '..' not in pathlib.PurePosixPath(path).parts
          subprocess.run(['git', 'rm', '--', *data['deleted']], check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Replace configuration screen with native Codex Wake controls' -m 'Use English Hey Codex, guided permissions, Enable, Stop, and live status. Preserve the upstream wake engine and launcher. Verified locally with 75 passing tests, release lint, and the release APK build.'
          git push origin HEAD:main
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' || sdkmanager --channel=3 'platforms;android-37.0' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Test and build
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintRelease :app:assembleRelease
      - name: Sign and verify personal test APK
        run: |
          set -euo pipefail
          keytool -genkeypair -keystore "$RUNNER_TEMP/test.keystore" -storepass android -keypass android -alias codex-test -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Codex Wake Personal Test'
          tools="$ANDROID_HOME/build-tools/37.0.0"
          "$tools/zipalign" -P 16 -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/test.keystore" --ks-pass pass:android --key-pass pass:android --ks-key-alias codex-test --out CodexWake.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify --verbose CodexWake.apk
          "$tools/zipalign" -c -P 16 4 CodexWake.apk
          sha256sum CodexWake.apk > CodexWake.apk.sha256
      - name: Publish phone download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts)"
          cat > "$RUNNER_TEMP/notes.md" <<'NOTES'
          Download **CodexWake.apk** below on your Android phone, open it, and install.

          Open **Codex Wake**, tap **Enable Codex Wake**, and allow the requested access. Keep ChatGPT as your default digital assistant. Say **Hey Codex** when the status shows that it is listening.

          This first test replaces the Compose screen with native Android controls and fixes the phrase to English Hey Codex. The existing wake engine, microphone handoff, ChatGPT launcher, and boot receiver are preserved.

          Automated Android tests and release lint pass before publication. Actual wake recognition and lock-screen behavior still need testing on the phone. This is a personal test signature; future test builds may require uninstalling the previous build.
          NOTES
          gh release create "v$version" CodexWake.apk CodexWake.apk.sha256 --target "$(git rev-parse HEAD)" --title "Codex Wake $version — phone test" --notes-file "$RUNNER_TEMP/notes.md" --prerelease
      - name: Save build reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phone-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-release.*
            app/build/outputs/mapping/release/mapping.txt
